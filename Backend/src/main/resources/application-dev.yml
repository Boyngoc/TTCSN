# ==========================================================================
# Cấu hình dành riêng cho môi trường phát triển (profile "dev").
# Bật log SQL và log DEBUG của ứng dụng để dễ theo dõi khi lập trình.
# ==========================================================================
spring:
  jpa:
    show-sql: true

# Cho phép Frontend (Vite dev server) gọi API khi phát triển.
# FE chạy ở cổng 5173; cả localhost lẫn 127.0.0.1 để tránh lỗi CORS.
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

logging:
  level:
    com.example.footballbooking: DEBUG
    org.hibernate.SQL: DEBUG
